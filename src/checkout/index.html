
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header class="divider">
      <div class="logo">
        <img src="../images/noun_Tent_2517.svg" alt="Tent logo" />
        <a href="../index.html">
          Sleep<span class="highlight">Outside</span>
        </a>
      </div>

      <div class="cart">
        <a href="../cart/index.html">Cart</a>
      </div>
    </header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place Your Order</h2>
        <div id="checkout-summary"></div>

        <h2>Customer Information</h2>

        <form id="checkout-form">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" required />

          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" required />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />

          <label for="street">Street Address</label>
          <input type="text" id="street" name="street" required />

          <label for="city">City</label>
          <input type="text" id="city" name="city" required />

          <label for="state">State / District</label>
          <input type="text" id="state" name="state" required />

          <button type="submit">Place Order</button>
        </form>
      </section>
    </main>

    <footer>&copy; 2025 Sleep Outside | BYU-Idaho WDD 330</footer>

    <script type="module" src="../js/checkout.js"></script>
  </body>
</html>
